# EXEMPLE — à coller dans Streamlit Cloud : Manage app > Settings > Secrets
# NE JAMAIS déposer ce fichier rempli (avec une vraie clé) dans GitHub.

# Fournisseur préféré : "mistral" (par défaut) ou "gemini"
LLM_PROVIDER = "mistral"

# Clé Mistral (console.mistral.ai > API keys)
MISTRAL_API_KEY = "colle-ta-cle-mistral-ici"

# Optionnel : clé Google Gemini, utilisée automatiquement en secours (aistudio.google.com > Get API key)
GEMINI_API_KEY = "colle-ta-cle-gemini-ici"

# Optionnel : noms de modèles (laisser par défaut si tout fonctionne)
# MISTRAL_MODEL = "mistral-small-latest"
# GEMINI_MODEL = "gemini-flash-latest"

# Optionnel : nombre maximum de corrections IA par session de navigation (défaut : 20)
# AI_MAX_CALLS = 20
